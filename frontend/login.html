<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Sign in to your SmartBus account.">

  <title>Login — SmartBus</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-page">

  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">

      <a href="./index.html" class="brand" aria-label="SmartBus home">
        <span class="brand-icon" aria-hidden="true">🚌</span>
        <span>Smart<span>Bus</span></span>
      </a>

      <a href="./index.html" class="auth-back-link">
        ← Back to home
      </a>

    </nav>
  </header>


  <main class="auth-main">

    <section class="auth-container">

      <div class="auth-card">

        <div class="auth-header">

          <div class="auth-icon" aria-hidden="true">
            🔐
          </div>

          <span class="eyebrow">Welcome back</span>

          <h1>Sign in to SmartBus</h1>

          <p>
            Access your bookings, tickets, and live bus tracking.
          </p>

        </div>


        <form id="loginForm" class="auth-form" novalidate>

          <div class="form-group">
            <label for="loginEmail">
              Email address
            </label>

            <div class="auth-input-wrapper">

              <span class="auth-input-icon" aria-hidden="true">
                @
              </span>

              <input type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email"
                required>

            </div>

            <small class="field-error" id="loginEmailError"></small>
          </div>


          <div class="form-group">

            <div class="form-label-row">
              <label for="loginPassword">
                Password
              </label>

              <a href="#" class="forgot-link">
                Forgot password?
              </a>
            </div>

            <div class="auth-input-wrapper">

              <span class="auth-input-icon" aria-hidden="true">
                •
              </span>

              <input type="password" id="loginPassword" name="password" placeholder="Enter your password"
                autocomplete="current-password" required>

              <button type="button" class="password-toggle" data-password-target="loginPassword"
                aria-label="Show password">
                Show
              </button>

            </div>

            <small class="field-error" id="loginPasswordError"></small>
          </div>


          <div class="auth-options">

            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" name="rememberMe">

              <span>Remember me</span>
            </label>

          </div>


          <button type="submit" class="btn btn-primary auth-submit">
            Sign In
            <span aria-hidden="true">→</span>
          </button>


          <p id="loginMessage" class="form-message" role="alert" aria-live="polite"></p>

        </form>


        <div class="auth-divider">
          <span>or</span>
        </div>


        <p class="auth-switch">
          Don't have an account?
          <a href="./register.html">Create one</a>
        </p>

      </div>


      <div class="auth-footer-text">
        <span>🚌</span>
        Travel smarter with SmartBus.
      </div>

    </section>

  </main>


  <script src="./js/auth.js"></script>

</body>

</html>
