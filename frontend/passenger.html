<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Info - SmartBus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a href="index.html" class="logo">Smart<span>Bus</span></a>
        <ul class="nav-links">
          <li><a href="search.html">Search Buses</a></li>
          <li><a href="tracking.html">Live Tracking</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container flex-center" style="flex: 1; padding: 60px 0;">
    <div style="width: 100%; max-width: 500px;">
      <form id="passenger-form" action="confirmation.html">
        <h2 style="text-align: center; margin-bottom: 8px;">Passenger Information</h2>
        <p style="text-align: center; margin-bottom: 24px; opacity: 0.7; font-size: 0.95rem;">
          Please enter traveler details below
        </p>

        <div class="form-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="firstName" placeholder="Enter first name" required>
        </div>

        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="lastName" placeholder="Enter last name" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="Enter email address" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Proceed to Booking Confirmation</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 SmartBus Project. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
