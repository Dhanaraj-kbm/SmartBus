<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="View your SmartBus bookings.">

  <title>My Bookings — SmartBus</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bookings-page">

  <header class="dashboard-header">

    <div class="container dashboard-navbar">

      <a href="/passenger/dashboard.html" class="brand" aria-label="SmartBus dashboard">
        <span class="brand-icon" aria-hidden="true">
          🚌
        </span>

        <span>
          Smart<span>Bus</span>
        </span>
      </a>


      <nav class="dashboard-nav" aria-label="Main navigation">

        <a href="/passenger/dashboard.html" class="dashboard-nav-link">
          Dashboard
        </a>

        <a href="/search.html" class="dashboard-nav-link">
          Search Buses
        </a>

        <a href="/passenger/bookings.html" class="dashboard-nav-link active" aria-current="page">
          My Bookings
        </a>

      </nav>


      <div class="dashboard-user">

        <button type="button" class="notification-button" aria-label="Notifications">
          ♢

          <span class="notification-badge">
            2
          </span>
        </button>


        <button type="button" class="user-menu" aria-label="Passenger account">

          <span class="user-avatar">
            R
          </span>

          <span class="user-info">

            <strong>
              Raj
            </strong>

            <small>
              Passenger
            </small>

          </span>

          <span class="user-chevron" aria-hidden="true">
            ▾
          </span>

        </button>

      </div>

    </div>

  </header>


  <main class="bookings-main">

    <div class="container">


      <!-- Page heading -->

      <section class="bookings-heading">

        <div>

          <span class="eyebrow">
            PASSENGER
          </span>

          <h1>
            My bookings
          </h1>

          <p>
            View and manage your SmartBus journeys.
          </p>

        </div>


        <a href="/search.html" class="btn btn-primary">
          Book a Bus
          <span aria-hidden="true">
            →
          </span>
        </a>

      </section>


      <!-- Tabs -->

      <nav class="booking-tabs" aria-label="Booking categories">

        <button type="button" class="booking-tab active" data-tab="upcoming">
          Upcoming
          <span id="upcomingCount">
            0
          </span>
        </button>


        <button type="button" class="booking-tab" data-tab="past">
          Past
          <span id="pastCount">
            0
          </span>
        </button>


        <button type="button" class="booking-tab" data-tab="cancelled">
          Cancelled
          <span id="cancelledCount">
            0
          </span>
        </button>

      </nav>


      <!-- Upcoming -->

      <section id="upcomingBookings" class="booking-section" aria-labelledby="upcoming-heading">

        <div class="booking-section-heading">

          <div>

            <span class="panel-eyebrow">
              YOUR JOURNEYS
            </span>

            <h2 id="upcoming-heading">
              Upcoming trips
            </h2>

          </div>

          <span id="upcomingSummary" class="booking-section-summary">
            0 trips
          </span>

        </div>


        <div id="upcomingList" class="booking-list">
          <!-- Generated by bookings.js -->
        </div>

      </section>


      <!-- Past -->

      <section id="pastBookings" class="booking-section hidden" aria-labelledby="past-heading">

        <div class="booking-section-heading">

          <div>

            <span class="panel-eyebrow">
              HISTORY
            </span>

            <h2 id="past-heading">
              Past trips
            </h2>

          </div>

          <span id="pastSummary" class="booking-section-summary">
            0 trips
          </span>

        </div>


        <div id="pastList" class="booking-list">
          <!-- Generated by bookings.js -->
        </div>

      </section>


      <!-- Cancelled -->

      <section id="cancelledBookings" class="booking-section hidden" aria-labelledby="cancelled-heading">

        <div class="booking-section-heading">

          <div>

            <span class="panel-eyebrow">
              CANCELLED
            </span>

            <h2 id="cancelled-heading">
              Cancelled bookings
            </h2>

          </div>

          <span id="cancelledSummary" class="booking-section-summary">
            0 bookings
          </span>

        </div>


        <div id="cancelledList" class="booking-list">
          <!-- Generated by bookings.js -->
        </div>

      </section>


    </div>

  </main>


  <script src="../js/bookings.js"></script>

</body>

</html>
